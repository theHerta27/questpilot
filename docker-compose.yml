services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: questpilot
      POSTGRES_USER: questpilot
      POSTGRES_PASSWORD: questpilot
    ports:
      - "5432:5432"
    volumes:
      - questpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://questpilot:questpilot@postgres:5432/questpilot
      MODEL_PROVIDER: fake
      PGVECTOR_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: questpilot
      OBJECT_STORAGE_ACCESS_KEY: questpilot
      OBJECT_STORAGE_SECRET_KEY: questpilot-demo-only
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: questpilot
      MINIO_ROOT_PASSWORD: questpilot-demo-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - questpilot-objects:/data

volumes:
  questpilot-postgres:
  questpilot-objects:
