[project]
name = "questpilot"
version = "0.1.0"
description = "Verifiable planning agent for complex progression games"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.28",
  "langgraph>=0.4",
  "mcp>=1.9",
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "pgvector>=0.4",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "structlog>=25.1",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[project.scripts]
questpilot-api = "questpilot.api.main:run"
questpilot-seed = "questpilot.cli:seed"
questpilot-atlas = "questpilot.cli:atlas"
questpilot-drop-data = "questpilot.cli:drop_data"
questpilot-eval = "questpilot.cli:evaluate"
questpilot-mcp = "questpilot.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/questpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = ["online: optional live upstream contract tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
